<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      font-family: "Segoe UI", sans-serif;
      animation: fadeIn 1.5s ease-in-out;
    }

    .card {
      background: white;
      padding: 40px 60px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      animation: popIn 1s ease;
    }

    h1 {
      margin: 0;
      font-size: 3rem;
      color: #333;
      letter-spacing: 2px;
    }

    p {
      margin-top: 10px;
      font-size: 1.2rem;
      color: #555;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Hello World!</h1>
    <p>Welcome to your first fancy HTML page ✨</p>
  </div>
</body>
</html>
