<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      font-family: "Segoe UI", sans-serif;
    }

    nav {
      position: absolute;
      top: 0;
      width: 100%;
      background: rgba(255,255,255,0.2);
      padding: 15px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    nav a {
      margin: 0 20px;
      color: white;
      font-size: 1.2rem;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .card {
      background: white;
      padding: 40px 60px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 3rem;
      color: #333;
    }

    p {
      margin-top: 10px;
      font-size: 1.2rem;
      color: #555;
    }
  </style>
</head>

<body>
  <nav>
    <a href="hello.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="card">
    <h1>Hello World!</h1>
    <p>Welcome to your first fancy HTML page ✨</p>
  </div>
</body>
</html>
