<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #36d1dc, #5b86e5);
      color: white;
    }

    nav {
      text-align: center;
      margin-bottom: 40px;
    }

    nav a {
      margin: 0 20px;
      color: white;
      font-size: 1.2rem;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .content {
      max-width: 700px;
      margin: auto;
      background: rgba(255,255,255,0.2);
      padding: 30px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      background: white;
      color: #333;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #ddd;
    }
  </style>
</head>

<body>
  <nav>
    <a href="hello.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="content">
    <h1>Contact Us</h1>
    <p>Feel free to reach out using the form below.</p>

    <input type="text" placeholder="Your Name" />
    <input type="email" placeholder="Your Email" />
    <textarea rows="5" placeholder="Your Message"></textarea>
    <button>Send Message</button>
  </div>
</body>
</html>
